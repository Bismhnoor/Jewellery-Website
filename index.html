  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <!-- ================= HEADER ================= -->
  <header class="site-header">
    <a href="#" class="logo">
      <span class="logo-mark">&#10047;</span>
      <span class="logo-text">
        <h1>Noor</h1>
        <span>Jewellers</span>
      </span>

  <!-- ================= PAGE HEADING ================= -->

    <h2>Our <em>Collection</em></h2>
    <p>Handpicked pieces that feel like you. Click any photo to open the lightbox — use the arrows or your keyboard to browse.</p>

  <!-- ================= CATEGORY FILTERS (BONUS) ================= -->

  <p class="results-text" id="resultsText"></p>

  <!-- ================= LIGHTBOX ================= -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image lightbox" aria-hidden="true">
    <div class="lb-backdrop"></div>

    <div class="lb-content">
      <button class="lb-close" id="lbClose" aria-label="Close lightbox">&times;</button>
      <button class="lb-arrow lb-prev" id="lbPrev" aria-label="Previous image">&#10094;</button>
      <button class="lb-arrow lb-next" id="lbNext" aria-label="Next image">&#10095;</button>

      <figure class="lb-stage">
        <img id="lbImage" src="" alt="" />
        <span class="lb-counter" id="lbCounter"></span>
        <figcaption class="lb-caption">
          <span class="lb-badge" id="lbCategory"></span>
          <h3 id="lbTitle"></h3>
          <p class="lb-price" id="lbPrice"></p>
        </figcaption>
      </figure>

      <div class="lb-thumbs" id="lbThumbs"></div>
    </div>
  </div>
